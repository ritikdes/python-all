{% extends "base.html" %}

{% block title %}Expense Tracker{% endblock %}

{% block content %}

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for exp in expenses %}
            <tr>
                <td>{{ exp.date }}</td>
                <td><a href="{{ url_for('show_expenses_by_category', name=exp.category) }}">{{exp.category }}</a></td>
                <td>Rs. {{ exp.amount }}</td>
                <td>{{ exp.description }}</td>
                <td>
                    <form action="{{ url_for('delete_expense', expense_id=exp.id) }}" method="POST">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
