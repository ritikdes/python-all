{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Filter Expenses</h2>

    <form action="{{ url_for('expense.filter_by_date')}}" method="GET">
        <div class="form-group">
            <label for="start_date">Start Date</label>
            <input type="date" name="start_date" required>
        </div>

        <div>
            <label for="end_date">End Date</label>
            <input type="date" name="end_date" required>
        </div>
        <button type="submit" class="btn-submit">Search</button>
    </form>
{% if expenses %}
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for exp in expense %}
            <tr>
                <td>{{ exp.date }}</td>
                <td><a href="{{ url_for('expense.show_expenses_by_category', name=exp.category) }}">{{ exp.category }}</a></td>
                <td>Rs. {{ exp.amount }}</td>
                <td>{{ exp.description }}</td>
                <td>
                    <form action="{{ url_for('expense.delete_expense', expense_id=exp.id) }}" method="POST">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}
</div>

{% endblock %}
