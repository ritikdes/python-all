{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Edit expense</h2>

    <form action="{{ url_for('expense.edit_expense', expense_id=expense.id) }}" method="POST">
        <div class="form-group">
            <label for="amount">Amount(Rs.)</label>
            <input type="number" name="amount" required value="expense.amount">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" name="description" value="expense.description">
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" required>
                <option value="" disabled selected>Select a category</option>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == expense.category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn-submit">Save Expense</button>
    </form>
</div>
{% endblock %}
