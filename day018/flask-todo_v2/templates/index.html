<h1>Flask Todo App</h1>

{% extends "base.html" %}

{% block title %}My Tasks{% endblock %}

{% block content %}


<form action="{{ url_for('todo.add_task')}}" method="POST">
    <input type="text" name="task_name" placeholder="Enter Task name" required>
    <select name="category">
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Study">Study</option>
        <option value="Health">Health</option>
        <option value="Other">Other</option>
    </select>

    <button type="submit">Add Task</button>
</form>
<hr>
<ul>
    {% for task in tasks %}
    <li>
        <span class="task-text {% if task.done %}completed{% endif %}">
            {{ task.name }}
        </span>

        <span class="category-tag {{ task.category|lower }}">{{ task.category }}</span>
            {% if not task.done %}
            <form action="{{ url_for('todo.mark_done', task_id=task.id) }}" method="POST" style="margin: 0;">
                <button type="submit" class="btn-done">Done</button>
            </form>
            {% endif %}

            <form action="{{ url_for('todo.delete_task', task_id=task.id)}}" method="POST" style="margin: 0;">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
    </li>
    {% endfor %}
</ul>
{% endblock %}
